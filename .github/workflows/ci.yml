name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El emulador de Firestore corre en la JVM (para las pruebas de reglas).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      # Descargar el emulador es lo más lento; se cachea entre corridas.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v13

      - name: Reglas de Firestore
        run: npm run test:rules
