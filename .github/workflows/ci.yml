name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El emulador de Firestore corre en la JVM (para las pruebas de reglas).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      # Solo falla con ERRORES o si SUBE el tope de avisos de `npm run lint`
      # (package.json): los avisos existentes se van corrigiendo de a poco.
      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      # Descargar el emulador es lo más lento; se cachea entre corridas.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v13

      - name: Reglas de Firestore
        run: npm run test:rules

      # Sesión del servidor de punta a punta: levanta `next dev` real con los
      # emuladores de Auth y Firestore. Tarda (compila Next), pero es lo único
      # que prueba la cookie y las páginas de servidor juntas.
      - name: Sesión del servidor (e2e)
        run: npm run test:session
        timeout-minutes: 8

      # Compila producción (detecta errores que `next dev` no ve, como un import
      # de servidor en un componente de cliente) y comprueba que los ganchos de
      # las pruebas en navegador NO viajan al JavaScript que recibe el público:
      # abren el inicio de sesión con un token y apuntan a los emuladores.
      - name: Build de producción
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: x
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-cresi.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cresi
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-cresi.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:1:web:1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx next build
        timeout-minutes: 6

      - name: Los ganchos de prueba no están en el bundle público
        run: bash scripts/check-bundle.sh

  # Pruebas en un navegador real (Chromium) contra `next dev` y los emuladores,
  # con las reglas reales de Firestore. Van aparte para correr en paralelo.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v13

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas en navegador
        run: npm run test:browser

      # Lo mismo contra un BUILD DE PRODUCCIÓN: la política de seguridad (CSP) es otra
      # que en desarrollo, y esto prueba el sitio con la que recibe el público.
      - name: Pruebas en navegador (build de producción)
        run: npm run test:browser:prod
        timeout-minutes: 10

      # Si algo falla, el reporte trae capturas y el "trace" para reproducirlo.
      - name: Guardar el reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
